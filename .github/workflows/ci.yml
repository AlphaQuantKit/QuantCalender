name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate D1 migrations locally
        working-directory: worker
        run: pnpm exec wrangler d1 migrations apply wq-meeting-calendar --local
      - run: pnpm check
      - name: Validate member passwords in workerd and D1
        working-directory: worker
        run: node scripts/passwords-runtime-smoke.mjs
      - name: Validate full-size member imports in workerd and D1
        working-directory: worker
        run: node scripts/member-imports-runtime-smoke.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts/tests -v
      - name: Reject committed secrets
        shell: bash
        run: |
          if grep -RIE --exclude-dir=node_modules --exclude-dir=.git '(ADMIN_PASSWORD_HASH|SESSION_SECRET|WQ_ID_HMAC_SECRET)=[^r][^e][^p]' .; then
            echo "Potential secret found in repository"
            exit 1
          fi
