name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", "packages/shared/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure D1 binding
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ vars.CLOUDFLARE_D1_DATABASE_ID }}/" worker/wrangler.toml
      - name: Apply D1 migrations
        working-directory: worker
        run: pnpm exec wrangler d1 migrations apply wq-meeting-calendar --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        working-directory: worker
        run: |
          secrets_file="$RUNNER_TEMP/wq-worker-secrets.json"
          jq -n \
            --arg admin_wq_id "$ADMIN_WQ_ID" \
            --arg admin_password_hash "$ADMIN_PASSWORD_HASH" \
            --arg wq_id_hmac_secret "$WQ_ID_HMAC_SECRET" \
            --arg turnstile_secret "$TURNSTILE_SECRET" \
            --arg session_secret "$SESSION_SECRET" \
            '{
              ADMIN_WQ_ID: $admin_wq_id,
              ADMIN_PASSWORD_HASH: $admin_password_hash,
              WQ_ID_HMAC_SECRET: $wq_id_hmac_secret,
              TURNSTILE_SECRET: $turnstile_secret,
              SESSION_SECRET: $session_secret
            } + (if (env.MEMBER_SYNC_TOKEN // "") != "" then {MEMBER_SYNC_TOKEN: env.MEMBER_SYNC_TOKEN} else {} end)' > "$secrets_file"
          pnpm exec wrangler deploy \
            --secrets-file "$secrets_file" \
            --var "APP_ENV:production" \
            --var "ALLOWED_ORIGINS:${{ vars.CALENDAR_ORIGIN }}" \
            --var "API_BASE_URL:${{ vars.VITE_API_BASE_URL }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_WQ_ID: ${{ secrets.ADMIN_WQ_ID }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          WQ_ID_HMAC_SECRET: ${{ secrets.WQ_ID_HMAC_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MEMBER_SYNC_TOKEN: ${{ secrets.MEMBER_SYNC_TOKEN }}
